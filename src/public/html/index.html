<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title id="title"></title>
        <meta name="google-site-verification" content="O3Hb_s167WusxOOfF1NAesCBkFG_V5btVqwIYSJyNio" />
        <link rel="icon" href="images/edu_helper_logo.jpg" type="image/icon type">
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <div class="lang-toggle">
            <button class="lang-btn" onclick="setLanguage('en')">English language</button>
            <button class="lang-btn" onclick="setLanguage('ua')">Українська мова</button>
        </div>

        <main class="content">
            <h1 id="welcome"></h1>
            <img src="images/edu_helper.jpg" alt="education helper logo">

            <p id="manage_classroom"></p>

            <p><strong id="how_works"></strong></p>
            <ol class="container">

                <li id="bot_start"><strong>@edu_helper_chat_bot</strong></li>
                <li id="enter_menu">

                    <ul class="container">
                        <li id="ai_chat"></li>
                        <li id="classroom_workspaces"></li>
                        <li id="own_tests"></li>
                    </ul>

                </li>
            </ol>

            <p><strong id="auth_perms"></strong></p>
            <ul class="container">
                <li id="bot_uses_google_auth"></li>
                <li id="any_questions">
                </li>
            </ul>

            <a href="/privacy-policy" id="privacy_policy"></a>
            <a href="/terms-of-service" id="terms_of_service"></a>
        </main>

        <script>
            let translations = {};

            async function loadTranslations() {
                translations = await (await fetch('./translations/indexTrans.json')).json();
                setLanguage('en');
            }

            function setLanguage(lang) {
                Object.keys(translations[lang]).forEach(id => {
                    const el = document.getElementById(id);

                    if (el) {
                        const text = translations[lang][id];

                        if (text.includes("<") && text.includes("</")) {
                            el.innerHTML = text

                        } else {
                            el.textContent = text;
                        }
                    }
                });

                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent.includes(lang.toUpperCase()));
                });
            }

            window.onload = loadTranslations;
        </script>
    </body>

</html>
