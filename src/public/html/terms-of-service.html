<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title id="terms_of_service"></title>
        <link rel="icon" href="images/classroom_helper_logo.jpg" type="image/icon type">
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <div class="lang-toggle">
            <button class="lang-btn" onclick="setLanguage('en')">English language</button>
            <button class="lang-btn" onclick="setLanguage('ua')">Українська мова</button>
        </div>

        <main class="content">
            <h1 id="terms_of_service"></h1>
            <p class="italic" id="last_updated"></p>

            <p id="using_chatbot"></p>
            <h3 id="usage_restr"></h3>

            <ul class="container">
                <li id="follow_google_policies"></li>
                <li id="do_not_use_app"></li>
            </ul>

            <h3 id="no_guarantee"></h3>
            <ul class="container">
                <li id="do_not_guarantee"></li>
            </ul>

            <h3 id="termination"></h3>
            <ul class="container">
                <li id="can_revoke_access"></li>
            </ul>

            <p id="contact_us">
            </p>
            <a href="/" id="back_homepage"></a>
        </main>

        <script>
            let translations = {};

            async function loadTranslations() {
                translations = await (await fetch('./translations/termsOfServiceTrans.json')).json();
                setLanguage('en');
            }

            function setLanguage(lang) {
                Object.keys(translations[lang]).forEach(id => {
                    const el = document.getElementById(id);

                    if (el) {
                        const text = translations[lang][id];

                        if (text.includes("<") && text.includes("</")) {
                            el.innerHTML = text

                        } else {
                            el.textContent = text;
                        }
                    }
                });

                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent.includes(lang.toUpperCase()));
                });
            }

            window.onload = loadTranslations;
        </script>

    </body>

</html>
