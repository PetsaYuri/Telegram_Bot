<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title id="privacy_policy"></title>
        <link rel="icon" href="images/edu_helper_logo.jpg" type="image/icon type">
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <div class="lang-toggle">
            <button class="lang-btn" onclick="setLanguage('en')">English language</button>
            <button class="lang-btn" onclick="setLanguage('ua')">Українська мова</button>
        </div>

        <main class="content">
            <h1 id="privacy_policy"></h1>
            <p class="italic" id="last_updated"></p>

            <p>
                <strong id="introduction"></strong>
            </p>

            <p id="policy_explains"></p>

            <p>
                <strong id="info_collect"></strong>
            </p>

            <p id="collect_data"></p>
            <ul class="container">
                <li id="auth_data"></li>
                <li id="course_data"></li>
                <li id="encrypted_token"></li>
                <li id="telegram_chat_id"></li>
            </ul>

            <p>
                <strong id="how_use_info"></strong>
            </p>

            <p id="we_use_data_to"></p>
            <ul class="container">
                <li id="auth_retrieve_data"></li>
                <li id="improve_user_exp"></li>
                <li id="enable_interact"></li>
                <li id="ensure_security"></li>
            </ul>

            <p>
                <strong id="data_retention"></strong>
            </p>

            <ul class="container">
                <li id="retain_data"></li>
                <li id="associated_data"></li>

                <li id="data_deletion">
                    <strong>petsa.yurii@student.uzhnu.edu.ua</strong>.
                </li>

                <li id="refresh_tokens_stored"></li>
            </ul>

            <p>
                <strong id="data_sharing"></strong>
            </p>

            <ul class="container">
                <li id="do_not_sell"></li>
                <li id="oauth2_auth_tokens"></li>
                <li id="follow_secur_standards"></li>
            </ul>

            <p><strong id="your_rights"></strong></p>
            <p id="have_right"></p>

            <ul class="container">
                <li id="revoke_access_any_time"></li>
                <li id="deletion_stored_data"></li>
                <li id="contact_us_for_data"></li>
            </ul>

            <p>
                <strong id="contact_us"></strong>
            </p>

            <p id="contact_us_for_privacy">
                <strong>petsa.yurii@student.uzhnu.edu.ua</strong>
            </p>

            <a href="/" id="back_homepage"></a>
        </main>

        <script>
            let translations = {};

            async function loadTranslations() {
                translations = await (await fetch('./translations/privacyPolicyTrans.json')).json();
                setLanguage('ua');
            }

            function setLanguage(lang) {
                Object.keys(translations[lang]).forEach(id => {
                    const el = document.getElementById(id);

                    if (el) {
                        const text = translations[lang][id];

                        if (text.includes("<") && text.includes("</")) {
                            el.innerHTML = text

                        } else {
                            el.textContent = text;
                        }
                    }
                });

                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent.includes(lang.toUpperCase()));
                });
            }

            window.onload = loadTranslations;
        </script>
    </body>

</html>
